<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriSoil - Sign Up Confirmation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="confirmation-card">
            <div class="logo-placeholder">
                <div class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="80" height="80">
                        <circle cx="50" cy="50" r="45" fill="#2CD34B" opacity="0.2"/>
                        <text x="50" y="50" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#8B6220" font-weight="bold">AgriSoil</text>
                        <text x="50" y="65" font-size="10" text-anchor="middle" dominant-baseline="middle" fill="#8B6220">LOGO</text>
                    </svg>
                </div>
            </div>
            
            <div class="confirmation-content">
                <div class="success-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48">
                        <circle cx="12" cy="12" r="11" fill="#2CD34B"/>
                        <path d="M9 12l2 2 4-4" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                
                <h1>Welcome to AgriSoil!</h1>
                <p class="confirmation-message">Your account has been successfully created.</p>
            </div>
            
            <div class="footer">
                <p>Need help? <a href="#">Contact Support</a></p>
            </div>
        </div>
    </div>
</body>
</html>
